name: Agent task
description: Structured task for Codex, Cursor, and other coding agents
title: "[agent] "
labels:
  - agent-task
body:
  - type: markdown
    attributes:
      value: |
        Use this template for work delegated to coding agents. Keep scope explicit so agents do not edit the wrong repo or forbidden paths. Mission Control workflow metadata below is required. API/connector-created Issues must include the same declarations as plain text in the Issue body; follow docs/agent-loop/issue-intake-contract.md.

        Keep one Single Task Issue when one independently verifiable bounded outcome has shared scope, ownership, and gate; ordinary substeps do not require child Issues. Use a Parent plus separate Child Task Issues only for separately deliverable objectives, materially different scope/owners/PR or review gates, or context-noise/objective-selection risk. A Parent is coordination/readback only; a Child is the self-contained execution contract. The Parent map is only a readback projection of the canonical predeclared Implementation Plan/Main Issue order and dependencies; it is not a second ledger or authority source.

        This execution form is for a Context-executable Single Task or Child Task. A coordination-only Parent is not a Context-executable Task; do not route a Parent to `bemoat:context` solely because it contains descriptive Goal/Scope text. Keep Parent content as coordination/readback and use a Main/Parent pointer from the executable Task or Child. A standalone Single Task remains valid and still uses the required metadata above.

        The repository/project dropdown below is landing metadata, not execution scope. The required `Scope boundaries` field is the one active execution Scope consumed by Context. Keep exactly one active Objective (the form label is the compatibility alias `Goal`) and exactly one active Scope (the form label is the compatibility alias `Scope boundaries`); do not add duplicate aliases. A missing, stale, unverified, or mismatching Parent readback does not authorize Child selection; fail closed for the accountable owner.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, links, prior PRs, or constraints the agent must read first.
      placeholder: |
        - Repo: bemoat-web-starter or child project name
        - Related PR/issue: #
        - Why now:
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One clear active execution objective in plain language. `Goal` is the parser-compatible form label for `Objective`.
      placeholder: Add X so that Y works for Z.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Checklist-style, testable conditions for done.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: likely_files
    attributes:
      label: Likely files
      description: Paths the agent may create or modify. List forbidden paths if any.
      placeholder: |
        Allowed:
        - src/collections/...
        Forbidden:
        - wrangler.jsonc
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Repository / project scope
      description: Where should this work land? This landing choice is not the execution Scope used by Context.
      options:
        - bemoat-web-starter (reusable infrastructure)
        - Child project (project-specific)
        - Docs / CI / agent-loop only
        - Unsure — triage first
    validations:
      required: true

  - type: textarea
    id: execution_scope
    attributes:
      label: Scope boundaries
      description: The one bounded execution Scope. State allowed work and forbidden effects/paths. This parser-compatible heading must not be duplicated by another Scope or Scope boundaries heading.
      placeholder: |
        Allowed:
        - docs/agent-loop/...
        Forbidden:
        - Create or rewrite unrelated Issues
        - Production, migration, secret, or deploy changes
    validations:
      required: true

  - type: dropdown
    id: task_size
    attributes:
      label: Task size
      description: Required for Context workflow derivation. If uncertain, classify conservatively before creating the Issue. See docs/agent-loop/checklist.md#task-size-tiers.
      options:
        - small
        - medium
        - core
    validations:
      required: true

  - type: dropdown
    id: mission_control_mode
    attributes:
      label: Mission Control mode
      description: Required for Context workflow derivation. “Not required” follows existing optional-mode behavior; “unsure” keeps STANDARD safeguards.
      options:
        - required
        - optional
        - not required
        - unsure
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Core / multi-stage planning fields** — omit the fields below for valid Small or standalone tasks.
        See docs/agent-loop/project-progress-tracking.md for durable progress boundaries.

  - type: markdown
    attributes:
      value: |
        **Current stateless workflow** — `bemoat:context` reconstructs evidence and route; `bemoat:handoff` appends the next bounded objective. Historical state and role records are read-only migration evidence.

  - type: input
    id: main_issue
    attributes:
      label: Main Issue / Parent pointer (Executable Task / Child)
      description: For an executable Single Task or Child, point to the existing Main/Parent Issue; the form label remains parser-compatible. This pointer does not make the Issue a coordination Parent or authorize work. Example `#106` or `owner/repo#106`. Leave blank for standalone Single Task Issues.
      placeholder: "#106"
    validations:
      required: false

  - type: input
    id: implementation_plan
    attributes:
      label: Implementation Plan path (Core / multi-stage)
      description: Canonical roadmap and execution contract. Example `docs/superpowers/plans/acme/launch/homepage/implementation-plan.md`
      placeholder: docs/superpowers/plans/...
    validations:
      required: false

  - type: input
    id: relevant_plan_section
    attributes:
      label: Relevant plan section
      description: Stable Slice or Task heading the Main Issue references. Omit when not yet known.
      placeholder: Slice A — Foundation
    validations:
      required: false

  - type: input
    id: approved_base
    attributes:
      label: Approved base branch
      description: Branch the active PR targets. Example `dev` or `main` during bootstrap.
      placeholder: dev
    validations:
      required: false

  - type: textarea
    id: durable_progress
    attributes:
      label: Durable Progress (Main / Parent readback only)
      description: Concise verified Main/Parent progress projection. Preserve the first incomplete milestone, current Slice/Task, relevant plan section, blocker/dependency, and Founder gate where applicable; do not use this as execution authorization.
      placeholder: |
        ## Durable Progress

        ### Slice A — Foundation
        - [ ] Task 1 implementation complete
        - [ ] Exact-head CI passed
        - [ ] Founder merge approval
        - [ ] PR merged into the approved base branch

        ## Current Stage
        - First incomplete milestone:
        - Current Slice:
        - Current Task or gate:
        - Active Task Issue:
        - Active PR:
        - Relevant plan section:
        - Current blocker or dependency:
        - Founder gate:

        ## Next Permitted Action
        One concrete action only.
    validations:
      required: false

  - type: input
    id: active_task_issue
    attributes:
      label: Active Task Issue
      description: Current bounded Task Issue pointer. Example `#119`.
      placeholder: "#119"
    validations:
      required: false

  - type: input
    id: active_pr
    attributes:
      label: Active PR
      description: Current implementation PR pointer. Example `#120`.
      placeholder: "#120"
    validations:
      required: false

  - type: textarea
    id: required_commands
    attributes:
      label: Required commands
      description: Commands the agent must run before opening a PR.
      value: |
        Docs/markdown/CI only:
        pnpm run guard:safety

        Code changes (required before PR):
        pnpm run check

        If Payload schema changes:
        pnpm run generate:types

        If admin components change:
        pnpm run generate:importmap

        Before merge (human, when practical):
        pnpm run check:full
      placeholder: |
        pnpm run guard:safety       # docs-only PRs
        pnpm run check              # code changes (required)
        pnpm run generate:importmap # if admin components change
        pnpm run generate:types     # if Payload schema changes
        pnpm run check:full         # before merge when practical
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Migration, security, Cloudflare, sync, or cross-project ID risks.
      placeholder: |
        - D1 migration needed: yes/no
        - Access control touched: yes/no
        - Cloudflare secrets or IDs: do not copy across projects
        - Sync-managed files: upstream to starter if reusable
    validations:
      required: true
